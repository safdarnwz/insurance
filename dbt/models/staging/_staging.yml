version: 2
models:
  - name: stg_member_charges
    description: "Silver member charges, analytics-friendly columns"
    columns:
      - name: record_id
        data_tests: [unique, not_null]
      - name: region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_region_master')
                field: region
  - name: stg_region_master
    columns:
      - name: region
        data_tests: [unique, not_null]
