[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-lakehouse"
version = "1.0.0"
description = "Insurance Medallion Lakehouse (ELT): Spark + Delta + dbt + Airflow, local Docker / Databricks Free Edition"
requires-python = ">=3.10"
# KYUN pyspark yahan NAHI hai: Databricks par runtime ka apna Spark hai; package
# pyspark install kar de to Databricks ka Spark toot jaata hai.
dependencies = [
    "pyyaml>=6.0",
]

# Saari runtime libraries requirements.txt me pinned hain (pip install -r requirements.txt)

[project.scripts]
insurance-pipeline = "insurance_lakehouse.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# config.yaml wheel me shamil ho (Databricks job ko chahiye)
[tool.setuptools.package-data]
insurance_lakehouse = ["conf/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src"]
# Databricks notebooks me spark/display/dbutils runtime inject karta hai
extend-exclude = ["notebooks", "dbt"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
